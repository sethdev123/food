name: Build unsigned iOS IPA

# Builds an unsigned .ipa on a macOS runner. The IPA can then be signed and
# installed on a physical iPhone with a free Apple ID using iloader/AltStore
# from Linux, Windows or macOS.

on:
  push:
    branches:
      - ios-build
  workflow_dispatch:

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install packages
        working-directory: flutterfood
        run: flutter pub get

      - name: Build iOS app (unsigned)
        working-directory: flutterfood
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL=http://172.16.6.224:8000/api

      - name: Package IPA
        working-directory: flutterfood
        run: |
          set -euo pipefail
          APP="build/ios/iphoneos/Runner.app"
          test -d "$APP"
          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa/Payload
          cp -R "$APP" build/ios/ipa/Payload/
          cd build/ios/ipa
          ditto -c -k --sequesterRsrc --keepParent Payload Foodie-unsigned.ipa
          ls -lh Foodie-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Foodie-unsigned-ipa
          path: flutterfood/build/ios/ipa/Foodie-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
